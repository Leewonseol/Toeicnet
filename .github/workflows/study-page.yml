# Publishes vocabulary/study.html alone to GitHub Pages. The page holds no vocabulary data:
# each learner selects vocabulary.csv from the private repository on their own device.
name: Study page

on:
  push:
    branches: [main]
    paths:
      - vocabulary/study.html
      - .github/workflows/study-page.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the page carries no data
        run: python -m unittest discover -s tests -p test_study_html.py
      - name: Stage the page only
        run: |
          mkdir _site
          cp vocabulary/study.html _site/index.html
          test "$(find _site -type f | wc -l)" -eq 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
